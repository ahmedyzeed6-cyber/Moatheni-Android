name: Build Moatheni APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOATHENI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::MOATHENI_KEYSTORE_BASE64 is empty or unavailable"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/moatheni-release.jks
          test -s app/moatheni-release.jks || { echo "::error::Decoded keystore is empty"; exit 1; }
      - name: Validate signing configuration
        env:
          STORE_PASSWORD: ${{ secrets.MOATHENI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOATHENI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOATHENI_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "::error::MOATHENI_STORE_PASSWORD is empty or unavailable"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::MOATHENI_KEY_ALIAS is empty or unavailable"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::MOATHENI_KEY_PASSWORD is empty or unavailable"; exit 1; }
          keytool -list -keystore app/moatheni-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing configuration validated."
      - name: Build APK
        env:
          MOATHENI_STORE_PASSWORD: ${{ secrets.MOATHENI_STORE_PASSWORD }}
          MOATHENI_KEY_ALIAS: ${{ secrets.MOATHENI_KEY_ALIAS }}
          MOATHENI_KEY_PASSWORD: ${{ secrets.MOATHENI_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moatheni-release-apk
          path: app/build/outputs/apk/release/*.apk
